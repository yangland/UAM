---
if_series: True
cuda_device: 0
type: cifar10
number_of_clients: 40
learning_rate: 0.001 # 0.01, 0.05
iterations: 80 #10, 24
early_stopping: False
early_stopping_tolerance: 3
early_stopping_min_delta: 0.0
numEpoch: 20 # 10
batch_size: 32
momentum: 0.9
server_lr_fix: True
server_lr: 0.1 # 0.05
server_lr_decay: 'NA'
server_lr_floor: 'NA'
if_noniid_s: [True] # [False, True]
# dirichlet_alpha
dirichlet_alpha_s: [0.2, 1.0, 20] # [0.2, 1.0]
num_classes: 10
train_amount: 4500
random_seed: 0
nn_model:  Cifar10_18L
class_names: ['plane', 'car', 'bird', 'cat', 'deer', 'dog', 'frog', 'horse', 'ship', 'truck']

# Model integrity check
check_integrity: False

# Aggregation Methods
sampling_layer: 'fc_layer.1.weight'
available_layers: ['fc_layer.3.weight', 'fc_layer.6.weight']
# allowed values are: ['fedavg', 'geom_median', 'krum', 'foolsgold', 'contra']
aggregation_method_s: ['fedavg', 'geom_median', 'foolsgold', 'contra', 'single-krum', 'coordinate_wise_median', 'trimmed_mean', 'bulyan']
krum_f: 15 # < 40/2 - 1
krum_m: 6
history_len: 1
contra_f: 0.1
contra_clients_selection: 10
trimmed_mean_m: 4
bulyan_m: 4

# Malicious Clients
malicious_attack_s: [True]
number_of_malicious_s: [16, 8]
# untargeted1 y = existed y label + 1, 1->2, ... , 9 -> 1
# untargeted2 y = existed y label -> random label of all class with same probability
# malicious_modes: 'untargeted2' # 'untargeted1', 'untargeted2', 'label_flipping', 'backdoor'

# RL based Malicious Attack
rl_based_attack: False
rl_mode: "untargeted_label_flip"
x_start: [0.0]
step: 1.0
#zoom_factor_base: 10 #10, 4
sigmoid_c1: 0.5
sigmoid_c2: 0.7
sigmoid_a1: 2.0
effective_action_domain: [[-4, 4]] # [[-4, 4], [-5, 2]]
empirical_points: [[-4.0], [0.0], [4.0]] # empty list means not consider empirical_points
rounds_before_restart: 5
rl_manual: False
manual_coordinates: [-1.0]
action_conv_func: "0-2" # "0-8"
# init_search_len: 15
# the goal, can be 'untargeted', 'random_pair'
# or any pairs of labels, such as [[1,7], [7,1]] means switch of label 1 and 7
# [[1,4], [4,5], [5,1]] switch between label 1, 4, 5 epsilon-greedy
# [[0,1], [1,2],...,[9,0]] untargeted1
Goal: 'untargeted'
malicious_proportion: [['untargeted1', 1, -1, -1]]
# 'untargeted1','untargeted2', 'label_flipping', 'backdoor'
malicious_mode_s: ['untargeted1']
targeted_pair_s: [[1, 7], [6, 8]]
weights_malicious_group_s: [[1.0]] # [0.2, 0.8]
respect_server_model_s: [True] # if malicious client's malicious training based on the model from server
# if respect_server_model is False:
malicious_group_agg_s: [False] # if there is an Averaging between clients of one malicious group

# Visualization
weights_layer: 'fc_layer.1.weight' # fc_layer.3.weight
distance_matrix: 'cos' # 'cos', 'l2', 'cka'
plot_individual: False
plot_global: False
plot_train: True
plot_rl: True
each_layer_list: [[4, 1]]
create_video: False