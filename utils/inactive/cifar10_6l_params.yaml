---
if_series: False
type: cifar10
number_of_clients: 40
learning_rate: 0.01
iterations: 10 #10
numEpoch: 10
batch_size: 32
momentum: 0.9
server_lr: 0.5
server_lr_decay: 0.05
server_lr_floor: 0.1
if_noniid: False
dirichlet_alpha: 1.0
num_classes: 10
train_amount: 4500
random_seed: 0
nn_model: Cifar10_6L
class_names: ['plane', 'car', 'bird', 'cat', 'deer', 'dog', 'frog', 'horse', 'ship', 'truck']

# Model integrity check
check_integrity: False

# Malicious Clients
malicious_attack: False
number_of_malicious: 0
malicious_mode: 'label_flipping' # 'untargeted1', 'untargeted2', 'label_flipping', 'backdoor'
malicious_proportion: [['untargeted1', 1, -1, -1]]
# untargeted1 y = existed y label + 1, 1->2, ... , 9 -> 1
# untargeted2 y = existed y label -> random label of all class with same chance
from_label: 1
to_label: 7
respect_server_model: False # if malicious client's malicious training based on the model from server
# if respect_server_model is False:
malicious_group_agg: False # if there is an Averaging between clients of one malicious group

# Aggregation Methods
sampling_layer: 'fc3.weight'
available_layers: ['linear.weight', 'layer4.1.bn2.weight']
# allowed values are: ['fedavg', 'geom_median', 'krum', 'foolsgold', 'contra']
aggregation_method: 'fedavg'
krum_f: 15 # < 40/2 - 1
krum_m: 6
history_len: 1
contra_f: 0.1
contra_clients_selection: 10

# Visualization
weights_layer: 'fc3.weight'
distance_matrix: 'cos' # 'cos', 'l2', 'cka'
plot_individual: False
plot_global: False
each_layer_list: [[8, 1]]
create_video: False