---
if_series: False
cuda_device: 0
type: cifar10
number_of_clients: 12
learning_rate: 0.001 # 0.01
iterations: 60 # 40
early_stopping: False
early_stopping_tolerance: 5
early_stopping_min_delta: 0
numEpoch: 20 # 10
batch_size: 32
momentum: 0.9
server_lr_fix: True
server_lr: 0.1 # 0.5
server_lr_decay: 0.001
server_lr_floor: 0.005
if_noniid: True
dirichlet_alpha: 20 # [0.2, 1.0, 20]
num_classes: 10
train_amount: 5000 # 4500
random_seed: 0
nn_model:  Cifar10_18L
class_names: ['plane', 'car', 'bird', 'cat', 'deer', 'dog', 'frog', 'horse', 'ship', 'truck']

# Model integrity check
check_integrity: False

# Aggregation Methods
sampling_layer: 'fc_layer.1.weight'
available_layers: ['fc_layer.1.weight', 'fc_layer.3.weight', 'fc_layer.6.weight']
# allowed values are: ['fedavg', 'geom_median', 'krum', 'foolsgold', 'contra']
aggregation_method: 'fedavg'
krum_f: 15 # < 40/2 - 1
krum_m: 1
history_len: 1
contra_f: 0.1
contra_clients_selection: 10
trimmed_mean_m: 4
bulyan_m: 4


# Malicious Clients
malicious_attack: False
number_of_malicious: 3
# untargeted1 y = existed y label + 1, 1->2, ... , 9 -> 1
# untargeted2 y = existed y label -> random label of all class with same chance
# malicious_mode: 'untargeted2' # 'untargeted1', 'untargeted2', 'label_flipping', 'backdoor'

# RL based Malicious Attack
rl_based_attack: False
rl_mode: "reverse_grad"
x_start: [0.0] # need to be float numbers
step: 1.0
zoom_factor_base: 10 #10, 4
sigmoid_c1: 0.5
sigmoid_c2: 0.7
sigmoid_a1: 2.0
effective_action_domain: [[-4, 4]] # [[-4, 4], [-5, 2]]
empirical_points: [[-4.0], [0.0], [4.0]] # empty list means not consider empirical_points
rounds_before_restart: 5
rl_manual: False
manual_coordinates: [-1.0]
new_action_conv: False
# init_search_len: 8
# the goal, can be 'untargeted', 'random_pair'
# or any pairs of labels, such as [[1,7], [7,1]] means switch of label 1 and 7
# [[1,4], [4,5], [5,1]] switch between label 1, 4, 5 epsilon-greedy
# [[0,1], [1,2],...,[9,0]] untargeted1
Goal: 'untargeted'

malicious_proportion: [['untargeted1', 1, -1, -1]]
# malicious_proportion: [['label_flipping', 1, 1, 7]]
# malicious_proportion: [['backdoor', 0.6, 2, 7], ['label_flipping', 0.4, 1, 5]]
# malicious_proportion: [['label_flipping', 0.5, 1, 2], ['label_flipping', 0.5, 1, 7]]
# malicious_proportion: [['untargeted2', 0.6], ['untargeted1', 0.4]]
# respect_server_model: False # if malicious client's malicious training based on the model from server
# if respect_server_model is False:
# malicious_group_agg: False # if there is an Averaging between clients of one malicious group

# Visualization
weights_layer: 'fc_layer.1.weight'
distance_matrix: 'cos' # 'cos', 'l2', 'cka'
plot_individual: False
plot_global: False
plot_train: True
plot_rl: True
each_layer_list: [[4, 1]]
create_video: False