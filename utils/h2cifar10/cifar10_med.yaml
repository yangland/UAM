---
if_series: True
cuda_device: 3
type: cifar10
number_of_clients: 100
select_precentage: 10
selection_mode: fixed_pct
learning_rate: 0.01 # 0.01, 0.05
iterations: 300 #10, 24
early_stopping: False
early_stopping_tolerance: 3
early_stopping_min_delta: 0.0
numEpoch: 5 # 10
batch_size: 32
momentum: 0.9
server_lr_fix: False
server_lr: 1.0 # 0.5, 0.05
server_lr_decay: 'NA'
server_lr_floor: 'NA'
if_noniid_s: [True] # [False, True]
# dirichlet_alpha
dirichlet_alpha_s: [0.1] 
num_classes: 10
train_amount: 50000
random_seed: 0
nn_model:  SqueezeNet11_CIFAR
class_names: ['plane', 'car', 'bird', 'cat', 'deer', 'dog', 'frog', 'horse', 'ship', 'truck']

# Model integrity check
check_integrity: False

# Aggregation Methods
sampling_layer: 'features.12.expand3x3.weight'
available_layers: ['features.12.expand3x3.weight', 'features.12.expand1x1.weight']
# allowed values are: ['fedavg', 'geom_median', 'foolsgold', 'contra', 'single-krum', 'coordinate_wise_median', 'trimmed_mean', 'bulyan']

#aggregation_method_s: ['geom_median', 'single-krum', 'coordinate_wise_median']
#pre_aggr_method_s: ['NNM', 'bucketing', 'None']

aggregation_method_s: ['coordinate_wise_median']
pre_aggr_method_s: ['None']

krum_f: 4 # < 40/2 - 1
krum_m: 1
history_len: 1
contra_f: 0.1
contra_clients_selection: 5
trimmed_mean_m: 4
bulyan_m: 4

# Malicious Clients
# malicious_attack_s: [True]
number_of_malicious_s: [30]
# untargeted1 y = existed y label + 1, 1->2, ... , 9 -> 1
# untargeted2 y = existed y label -> random label of all class with same probability
# malicious_modes: 'untargeted2' # 'untargeted1', 'untargeted2', 'label_flipping', 'backdoor'
# attack_method: 'RL'
attack_method_s: ['None', 'RL', 'little', 'explicit boosting', 'min-max', 'min-sum', 'RL']
Median_att: false
White_box: false

# RL based Malicious Attack
rl_based_attack: True
rl_mode: "reverse_grad"
x_start: [0.0]
step: 1.0
sigmoid_c1: 0.7
effective_action_domain: [[-4, 4]] # [[-4, 4], [-5, 2]]
empirical_points: [[-4.0], [0.0], [4.0]] # empty list means not consider empirical_points
rounds_before_restart: 5
rl_manual: False
manual_coordinates: [-1.0]
action_conv_func: "0-10" # "0-8"
# init_search_len: 15
# the goal, can be 'untargeted', 'random_pair'
# or any pairs of labels, such as [[1,7], [7,1]] means switch of label 1 and 7
# [[1,4], [4,5], [5,1]] switch between label 1, 4, 5 epsilon-greedy
# [[0,1], [1,2],...,[9,0]] untargeted1
Goal: 'untargeted'
# eps for the epsilon-greedy algorithms
# pi_0_eps: 0.1
#pi_0_eps_decay: 0.1
#pi_0_eps_floor: 0.1
#
#pi_l_eps: 0.5
#pi_l_eps_decay: 0.1
#pi_l_eps_floor: 0.2

# parameters to adjust when rl_based_attack == False
malicious_proportion: [['untargeted', 1, -1, -1]]
# malicious_proportion: [['label_flipping', 1, 1, 7]]
# malicious_proportion: [['backdoor', 0.6, 2, 7], ['label_flipping', 0.4, 1, 5]]
# malicious_proportion: [['label_flipping', 0.5, 1, 2], ['label_flipping', 0.5, 1, 7]]
# malicious_proportion: [['untargeted2', 0.6], ['untargeted1', 0.4]]
# respect_server_model: False # if malicious client's malicious training based on the model from server
# if respect_server_model is False:
# malicious_group_agg: True # if there is an Averaging between clients of one malicious group

# Visualization
weights_layer: 'features.12.expand1x1.weight' # fc_layer.3.weight
distance_matrix: 'cos' # 'cos', 'l2', 'cka'
plot_individual: False
plot_global: False
plot_train: True
plot_rl: True
each_layer_list: [[4, 1]]
create_video: False